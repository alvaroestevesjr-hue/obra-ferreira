<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Obra Ferreira · Gestão</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: prancheta de obra — cabeçalho fixo com abas, checklist agrupado por disciplina, cronograma com barras de Gantt sobre tabela editável */
:root{
  --bg:#f3f3f0; --panel:#ffffff; --ink:#1d2124; --muted:#5d6468; --line:#d9dad5; --soft:#ecece7;
  --accent:#e0a100; --accent-ink:#1d2124;
  --hid:#1f6fb2; --ele:#c98a00; --arq:#2f8a57; --aca:#7a4fb0; --est:#5a6670; --dec:#c2412d;
  --ok:#2f8a57; --run:#c98a00; --todo:#8a9095;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15181a; --panel:#1e2225; --ink:#e7e8e4; --muted:#9aa1a5; --line:#33393d; --soft:#262b2e;
  --accent:#f0b520; --accent-ink:#15181a;
  --hid:#5aa6e6; --ele:#f0b520; --arq:#5cc48a; --aca:#b08ae0; --est:#9aa7b1; --dec:#ef7560;
  --ok:#5cc48a; --run:#f0b520; --todo:#7d858a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15181a; --panel:#1e2225; --ink:#e7e8e4; --muted:#9aa1a5; --line:#33393d; --soft:#262b2e;
  --accent:#f0b520; --accent-ink:#15181a;
  --hid:#5aa6e6; --ele:#f0b520; --arq:#5cc48a; --aca:#b08ae0; --est:#9aa7b1; --dec:#ef7560;
  --ok:#5cc48a; --run:#f0b520; --todo:#7d858a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
header .wrap{padding-block:14px 0;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
h1{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;margin:0;text-wrap:balance}
h1 span{color:var(--muted);font-weight:500}
.tabs{display:flex;gap:4px}
.tab{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.02em;background:none;border:0;color:var(--muted);padding:8px 14px 10px;cursor:pointer;border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
.notice{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:10px 12px;color:var(--muted);font-size:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:500 13px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-family:var(--mono);font-weight:500;font-size:12px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.sum .who{font-weight:600}
.sum .n{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.group{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.group-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.group-h h2{font-family:var(--display);font-size:21px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px}
.pipe{width:22px;height:8px;border-radius:4px;background:var(--c)}
.group-h .resp{font-size:13px;color:var(--muted)}
.group-h .add{margin-left:auto}
.btn{font:600 13px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px;padding:6px 11px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--dec);border-color:var(--dec)}
.btn:disabled{opacity:.5;cursor:default}
ul.items{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:11px 14px;border-top:1px solid var(--line);align-items:start}
.it:first-child{border-top:0}
.st{width:26px;height:26px;border-radius:50%;border:2px solid var(--todo);background:none;cursor:pointer;display:grid;place-items:center;padding:0;margin-top:1px}
.st[data-s="andamento"]{border-color:var(--run);background:conic-gradient(var(--run) 50%,transparent 0)}
.st[data-s="feito"]{border-color:var(--ok);background:var(--ok)}
.st[data-s="feito"]::after{content:"";width:9px;height:5px;border:2px solid var(--panel);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.it .txt{min-width:0}
.it .t{font-weight:500}
.it[data-s="feito"] .t{color:var(--muted);text-decoration:line-through}
.it .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;color:var(--muted);margin-top:3px}
.it .meta .tag{font-family:var(--mono);font-size:11.5px;background:var(--soft);padding:1px 6px;border-radius:3px}
.it .obs{font-size:13.5px;color:var(--muted);margin-top:4px;white-space:pre-wrap}
.edit-link{font:500 13px var(--body);background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 4px;text-decoration:underline}
form.ed{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;padding:12px 14px;background:var(--soft);border-top:1px solid var(--line)}
form.ed .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
input,select,textarea{font:400 14px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%;min-width:0}
textarea{min-height:60px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gantt-box,.table-box{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow-x:auto}
.gantt{min-width:760px;padding:10px 14px 14px;font-size:12.5px}
.g-head{display:grid;grid-template-columns:200px 1fr;margin-bottom:6px}
.g-weeks{position:relative;height:30px;border-bottom:1px solid var(--line)}
.g-weeks span{position:absolute;bottom:4px;font-family:var(--mono);font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.g-row{display:grid;grid-template-columns:200px 1fr;align-items:center;min-height:28px}
.g-row .lbl{padding-right:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-track{position:relative;height:28px;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:var(--wk) 100%}
.g-bar{position:absolute;top:7px;height:14px;border-radius:3px;background:var(--c,var(--est));opacity:.85}
.g-bar[data-s="Concluído"]{opacity:.4}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--dec)}
table{border-collapse:collapse;width:100%;min-width:860px}
th{font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;text-align:left;color:var(--muted);padding:9px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td input,td select,td textarea{border-color:transparent;background:transparent}
td input:hover,td select:hover,td textarea:hover,td input:focus,td select:focus,td textarea:focus{border-color:var(--line);background:var(--panel)}
td textarea{min-height:34px}
td.num{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:12px;font-variant-numeric:tabular-nums}
td input[type=date]{font-family:var(--mono);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sec-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.sec-h h2{font-family:var(--display);font-size:22px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:5px;font-size:13.5px;z-index:20}
@media (max-width:560px){h1{font-size:24px}.g-head,.g-row{grid-template-columns:140px 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

html,body{margin:0}
[hidden]{display:none!important}
.stack{display:flex;flex-direction:column;gap:14px}
.topline{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--muted)}
.topline button{font:500 12.5px var(--body);background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.it .obs a{color:var(--hid)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:30;padding:16px}
.modal-box{background:var(--panel);color:var(--ink);border-radius:8px;padding:18px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:12px}
.modal-box h2{font-family:var(--display);font-size:22px;margin:0}
.modal-box p{margin:0;font-size:14px;color:var(--muted)}
.modal-box input{font-size:20px;letter-spacing:.3em;font-family:var(--mono)}

/* ---- navegação maior ---- */
header .wrap{padding-block:14px 0}
.navwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.tabs{display:flex;gap:6px;padding-block:6px 10px;width:max-content}
.tab{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.02em;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px 16px;cursor:pointer;white-space:nowrap;border-bottom-width:1px}
.tab:hover{border-color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:inset 0 -4px 0 var(--accent)}
.tab .grp{display:block;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;opacity:.65;margin-bottom:1px}
/* ---- registros (medições, pagamentos, contratos) ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.rec{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec .t{font-weight:600}
.rec .val{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rec .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}
.rec .obs{grid-column:1/-1;font-size:13.5px;color:var(--muted);white-space:pre-wrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.pill.run{background:color-mix(in srgb,var(--run) 20%,transparent);border-color:color-mix(in srgb,var(--run) 50%,transparent)}
.pill.bad{background:color-mix(in srgb,var(--dec) 15%,transparent);border-color:color-mix(in srgb,var(--dec) 45%,transparent)}
/* ---- pastas ---- */
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:15px}
.crumbs button{font:600 15px var(--body);background:none;border:0;color:var(--hid);cursor:pointer;padding:2px 4px}
.crumbs span{color:var(--muted)}
.fold-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fold{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;text-align:left;font:600 14.5px var(--body);color:var(--ink);min-width:0}
.fold:hover{border-color:var(--muted)}
.fold svg{flex:none}
.fold span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.file{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.file:first-child{border-top:0}
.file .ext{font-family:var(--mono);font-size:11px;font-weight:600;padding:4px 6px;border-radius:4px;background:var(--soft);border:1px solid var(--line);min-width:44px;text-align:center}
.file .nm{font-weight:500;overflow-wrap:anywhere}
.file .sub{font-size:12.5px;color:var(--muted)}
.file .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:end;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:12px}
.inline-form label{flex:1 1 200px}
/* ---- visualizadores ---- */
.viewer{position:relative;height:min(72vh,720px);min-height:340px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.viewer .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px;font-size:14.5px}
.viewer .busy{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 12px;border-radius:5px;font-size:13px;z-index:2}
.vbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vbar .name{font-weight:600;font-size:14px;margin-left:auto;overflow-wrap:anywhere}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.hint{font-size:13px;color:var(--muted)}
.btn{font-size:14px;padding:8px 13px}
@media (min-width:900px){.tabs{flex-wrap:wrap;width:auto}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="eyebrow">Esteves Engenharia · Lote 02, Quadra D · Lagoa das Garças, Cambuí/MG</div>
    <h1>Obra Ferreira <span>· Gestão da obra</span></h1>
    <div class="topline"><span id="upd">Carregando…</span><button id="refresh" type="button">Atualizar</button><button id="forget-pin" type="button">Esquecer PIN</button></div>
    <nav class="navwrap" aria-label="Seções">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="checklist"><span class="grp">Obra</span>Checklist</button>
        <button class="tab" role="tab" data-tab="cronograma"><span class="grp">Obra</span>Cronograma</button>
        <button class="tab" role="tab" data-tab="medicoes"><span class="grp">Financeiro</span>Medições</button>
        <button class="tab" role="tab" data-tab="pagamentos"><span class="grp">Financeiro</span>Pagamentos</button>
        <button class="tab" role="tab" data-tab="contratos"><span class="grp">Financeiro</span>Contratos</button>
        <button class="tab" role="tab" data-tab="documentos"><span class="grp">Arquivos</span>Documentos</button>
        <button class="tab" role="tab" data-tab="projetos"><span class="grp">Arquivos</span>Projetos</button>
        <button class="tab" role="tab" data-tab="ifc"><span class="grp">Visualizar</span>Modelo IFC</button>
        <button class="tab" role="tab" data-tab="cad"><span class="grp">Visualizar</span>Planta DWG/DXF</button>
      </div>
    </nav>
  </div>
</header>
<main>
  <div class="wrap">
    <div id="status" class="notice">Carregando dados da obra…</div>
    <section id="view-checklist" class="view"></section>
    <section id="view-cronograma" class="view" hidden></section>
    <section id="view-medicoes" class="view" hidden></section>
    <section id="view-pagamentos" class="view" hidden></section>
    <section id="view-contratos" class="view" hidden></section>
    <section id="view-documentos" class="view" hidden></section>
    <section id="view-projetos" class="view" hidden></section>
    <section id="view-ifc" class="view" hidden></section>
    <section id="view-cad" class="view" hidden></section>
  </div>
</main>
<div id="toast" class="toast" hidden></div>
<div id="pin-modal" class="modal" hidden>
  <form id="pin-form" class="modal-box">
    <h2>PIN da equipe</h2>
    <p>Para alterar ou enviar arquivos, digite o PIN. Ele fica salvo neste aparelho.</p>
    <label for="pin-input">PIN<input id="pin-input" type="password" inputmode="numeric" autocomplete="off" required></label>
    <div class="actions"><button class="btn primary" type="submit">Confirmar</button><button class="btn" type="button" id="pin-cancel">Cancelar</button></div>
  </form>
</div>
<script>
/* Endereço da API (Apps Script publicado). Cole aqui a URL que termina em /exec. */
const API_URL = "COLE_AQUI_A_URL_DO_APPS_SCRIPT";
const configured = /^https:\/\/script\.google\.com\//.test(API_URL);

const DISC = [
  {k:"Hidráulica", c:"--hid", resp:"Álvaro"},
  {k:"Elétrica", c:"--ele", resp:"Fernando"},
  {k:"Arquitetura", c:"--arq", resp:"Cláudia Cunha"},
  {k:"Acabamento", c:"--aca", resp:"Cláudia Cunha"},
  {k:"Estrutura e cobertura", c:"--est", resp:"Álvaro"},
  {k:"Decisões do cliente", c:"--dec", resp:"Ferreira"},
];
const RESP = ["Álvaro","Fernando","Cláudia Cunha","Ferreira","Equipe da obra"];
const FASES = ["Decisão","Antes da laje","Cobertura","Embutidos na alvenaria","Acabamento","Contratação"];
const ST = ["Pendente","Em andamento","Feito"];
const ST_KEY = {"Pendente":"pendente","Em andamento":"andamento","Feito":"feito"};
const ST_CRON = ["Previsto","Em andamento","Concluído","Atrasado"];

/* Tabelas de registros (financeiro) */
const REG = {
  medicoes: {titulo:"Medições", novo:"Nova medição", principal:"servico", valor:"valor", data:"data",
    status:["Prevista","Medida","Aprovada","Paga"], ok:["Paga","Aprovada"], run:["Medida"],
    campos:[{k:"data",l:"Data",t:"date"},{k:"servico",l:"Serviço",t:"text",full:1},{k:"executor",l:"Executor",t:"text"},{k:"parcela",l:"Parcela / etapa",t:"text"},{k:"valor",l:"Valor (R$)",t:"money"},{k:"status",l:"Status",t:"select"},{k:"obs",l:"Observações",t:"area",full:1}],
    meta:r=>[r.executor,r.parcela], kpis:rs=>[["Total medido",sum(rs.filter(r=>r.status!=="Prevista"))],["Previsto",sum(rs.filter(r=>r.status==="Prevista"))],["Pago",sum(rs.filter(r=>r.status==="Paga"))]]},
  pagamentos: {titulo:"Pagamentos", novo:"Novo pagamento", principal:"favorecido", valor:"valor", data:"data",
    status:["A pagar","Pago"], ok:["Pago"], run:["A pagar"],
    campos:[{k:"data",l:"Data",t:"date"},{k:"favorecido",l:"Favorecido",t:"text"},{k:"referencia",l:"Referência",t:"text",full:1},{k:"valor",l:"Valor (R$)",t:"money"},{k:"forma",l:"Forma",t:"text",list:["PIX","Transferência","Boleto","Dinheiro","Cheque"]},{k:"status",l:"Status",t:"select"},{k:"obs",l:"Observações",t:"area",full:1}],
    meta:r=>[r.referencia,r.forma], kpis:rs=>[["Pago",sum(rs.filter(r=>r.status==="Pago"))],["A pagar",sum(rs.filter(r=>r.status!=="Pago"))],["Total",sum(rs)]]},
  contratos: {titulo:"Contratos", novo:"Novo contrato", principal:"contratado", valor:"valor", data:"assinatura",
    status:["Em negociação","Assinado","Em execução","Concluído"], ok:["Concluído"], run:["Em execução","Assinado"],

function sum(rs){return rs.reduce((a,r)=>a+(Number(r.valor)||0),0)}
function fmtData(s){if(!s)return"";const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(s)}
function hojeISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2800)}
function getPin(){try{return localStorage.getItem("of-pin")||""}catch(e){return""}}

/* ---------- dados ---------- */
async function load(){
  try{
    const r=await fetch(configured?API_URL:"data.json",{cache:"no-store"});const d=await r.json();
    if(!d.ok)throw new Error(d.erro||"erro");
    for(const k in D) D[k]=(d[k]||[]).map(x=>({...x,num:Number(x.num)}));
    loaded=true;
    if(configured)$("#status").hidden=true;else{$("#status").hidden=false;$("#status").textContent="Modo de visualização. Edição e envio de arquivos são liberados quando a planilha for conectada."}
    const at=new Date(d.atualizado);$("#upd").textContent="Atualizado "+at.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
    if(!document.querySelector("main form:focus-within, #view-cronograma :focus")&&!editing)render();
  }catch(e){
    $("#status").hidden=false;$("#status").textContent="Não foi possível carregar os dados. Verifique a internet e toque em Atualizar.";
  }
}
function needPin(fn){
  if(!configured){toast("Edição liberada assim que a planilha for conectada.");return}
  if(getPin()){fn();return}
  pendingAction=fn;$("#pin-modal").hidden=false;setTimeout(()=>$("#pin-input").focus(),50);
}
$("#pin-form").addEventListener("submit",e=>{e.preventDefault();const v=$("#pin-input").value.trim();if(!v)return;setPin(v);$("#pin-modal").hidden=true;$("#pin-input").value="";const f=pendingAction;pendingAction=null;f&&f()});
$("#pin-cancel").onclick=()=>{$("#pin-modal").hidden=true;pendingAction=null};

async function send(body,okMsg){
  busy++;
  try{
    const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,pin:getPin()})});
    const d=await r.json();
    if(!d.ok){if(/PIN/.test(d.erro||"")){setPin("");toast("PIN incorreto. Tente de novo.")}else toast(d.erro||"Não foi possível salvar.");return false}
    if(okMsg)toast(okMsg);editing=null;confirmDel=null;await load();render();return true;
  }catch(e){toast("Sem conexão. Nada foi salvo.");return false}
  finally{busy--}
}
function act(body,okMsg){needPin(()=>send(body,okMsg))}

/* ---------- abas ---------- */
function showTab(t){
  tab=t;editing=null;confirmDel=null;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  document.querySelectorAll(".view").forEach(v=>v.hidden=v.id!=="view-"+t);
  const b=document.querySelector(`.tab[data-tab="${t}"]`);b&&b.scrollIntoView({block:"nearest",inline:"nearest"});
  try{localStorage.setItem("of-tab",t)}catch(e){}
  render();
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function render(){
  if(!loaded&&tab!=="ifc"&&tab!=="cad")return;
  ({checklist:renderChecklist,cronograma:renderCrono,medicoes:()=>renderReg("medicoes"),pagamentos:()=>renderReg("pagamentos"),

function renderChecklist(){
  const el=$("#view-checklist"), items=D.checklist;

    if(editing==="new:"+d.k) h+=`<li>${ckForm({disciplina:d.k,responsavel:d.resp,fase:"Antes da laje",status:"Pendente"},true)}</li>`;
    for(const i of list){
      const sk=ST_KEY[i.status]||"pendente";

      <div class="txt"><div class="t">${esc(i.item)}</div><div class="meta"><span class="tag">${esc(i.fase)}</span><span>${esc(i.responsavel)}</span>${i.pedido?`<span>Pedido em ${esc(i.pedido)}</span>`:""}<span>${esc(i.status)}</span></div>${i.obs?`<div class="obs">${linkify(esc(i.obs))}</div>`:""}</div>

    h+=`</ul></div>`;

function linkify(s){return s.replace(/((?:https?:\/\/)?(?:www\.)?youtube\.com\/watch\?v=[\w-]+)/g,m=>`<a href="${m.startsWith("http")?m:"https://"+m}" target="_blank" rel="noopener">${m}</a>`)}

$("#view-checklist").addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;

/* ---------- CRONOGRAMA ---------- */
const DAY=864e5;
const pd=s=>{if(!s)return null;const d=new Date(s+"T12:00:00");return isNaN(d)?null:d};
const fmt=d=>String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
function respColor(r){if(/Fernando/.test(r))return"--ele";if(/Cláudia/.test(r))return"--arq";if(/Ferreira/.test(r))return"--dec";if(/Álvaro/.test(r))return"--hid";return"--est"}
function renderCrono(){
  const el=$("#view-cronograma"), rows=D.cronograma;
  const ds=rows.flatMap(r=>[pd(r.inicio),pd(r.fim)]).filter(Boolean);
  let gantt="";
  if(ds.length){
    let min=new Date(Math.min(...ds)),max=new Date(Math.max(...ds));
    min=new Date(min-((min.getDay()+6)%7)*DAY);
    const weeks=Math.max(1,Math.ceil((max-min)/DAY/7)+1),span=weeks*7*DAY,wk=100/weeks;
    const pos=d=>((d-min)/span*100), tp=pos(new Date());
    let wl="";for(let w=0;w<weeks;w++){if(weeks>20&&w%2)continue;wl+=`<span style="left:${(w+.5)*wk}%">${fmt(new Date(+min+w*7*DAY))}</span>`}
    gantt=`<div class="gantt-box"><div class="gantt"><div class="g-head"><span class="eyebrow" style="align-self:end">Semana de</span><div class="g-weeks">${wl}</div></div>
    ${rows.map(r=>{const a=pd(r.inicio),b=pd(r.fim);if(!a||!b)return`<div class="g-row"><span class="lbl">${esc(r.etapa)}</span><div class="g-track" style="--wk:${wk}%"></div></div>`;
      const l=pos(a),w=Math.max(.8,pos(new Date(+b+DAY))-l);
      return`<div class="g-row"><span class="lbl" title="${esc(r.etapa)}">${esc(r.etapa)}</span><div class="g-track" style="--wk:${wk}%"><div class="g-bar" data-s="${esc(r.status)}" style="left:${l}%;width:${w}%;--c:var(${r.status==="Atrasado"?"--dec":respColor(r.responsavel||"")})" title="${esc(r.etapa)}: ${fmt(a)} a ${fmt(b)}"></div>${tp>=0&&tp<=100?`<div class="g-today" style="left:${tp}%"></div>`:""}</div></div>`}).join("")}
    </div></div>`;
  }
  el.innerHTML=`<div class="stack">
  <div class="sec-h"><h2>Próximas etapas</h2><button class="btn primary" id="add-etapa">Adicionar etapa</button></div>
  <div class="hint">Datas estimadas. Ajuste direto na tabela: cada alteração salva sozinha. A linha vermelha marca hoje.</div>
  <div class="legend"><span><i class="pipe" style="--c:var(--hid)"></i>Álvaro</span><span><i class="pipe" style="--c:var(--ele)"></i>Fernando</span><span><i class="pipe" style="--c:var(--arq)"></i>Cláudia Cunha</span><span><i class="pipe" style="--c:var(--dec)"></i>Ferreira ou atrasado</span><span><i class="pipe" style="--c:var(--est)"></i>Equipe da obra</span></div>
  ${gantt||`<div class="notice">Sem etapas com datas ainda.</div>`}
  <div class="table-box"><table><thead><tr><th>#</th><th style="width:26%">Etapa</th><th>Responsável</th><th>Início</th><th>Fim</th><th>Status</th><th style="width:24%">Observações</th><th></th></tr></thead><tbody>
  ${rows.map(r=>`<tr data-num="${r.num}">
    <td class="num">${String(r.num).padStart(2,"0")}</td>
    <td><textarea id="e-etapa-${r.num}" data-f="etapa" aria-label="Etapa">${esc(r.etapa)}</textarea></td>
    <td><input id="e-resp-${r.num}" data-f="responsavel" list="resp-list" value="${esc(r.responsavel)}" aria-label="Responsável"></td>
    <td><input id="e-ini-${r.num}" type="date" data-f="inicio" value="${esc(r.inicio)}" aria-label="Início"></td>
    <td><input id="e-fim-${r.num}" type="date" data-f="fim" value="${esc(r.fim)}" aria-label="Fim"></td>
    <td><select id="e-st-${r.num}" data-f="status" aria-label="Status">${ST_CRON.map(s=>`<option ${s===r.status?"selected":""}>${s}</option>`).join("")}</select></td>
    <td><textarea id="e-obs-${r.num}" data-f="obs" aria-label="Observações">${esc(r.obs)}</textarea></td>
    <td>${confirmDel==="e"+r.num?`<button class="btn danger" data-edel-ok="${r.num}">Confirmar</button>`:`<button class="edit-link" data-edel="${r.num}">Excluir</button>`}</td>
  </tr>`).join("")}
  </tbody></table></div></div>`;
}
$("#view-cronograma").addEventListener("change",e=>{
  const f=e.target.dataset.f;if(!f)return;const num=Number(e.target.closest("tr").dataset.num);

const ICON_F=`<svg width="26" height="22" viewBox="0 0 26 22" aria-hidden="true"><path d="M1 4a2 2 0 0 1 2-2h7l2.5 3H23a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z" fill="var(--accent)" opacity=".85"/></svg>`;
function extOf(n){const m=String(n).toLowerCase().match(/\.([a-z0-9]+)$/);return m?m[1]:"arq"}
function subpastas(sec,cur){
  const all=new Set();
  D.pastas.filter(p=>p.secao===sec).forEach(p=>all.add(String(p.caminho)));
  D.arquivos.filter(a=>a.secao===sec&&a.pasta).forEach(a=>all.add(String(a.pasta)));
  const out=new Set(), pre=cur?cur+"/":"";
  all.forEach(p=>{if(pre&&!p.startsWith(pre))return;const rest=p.slice(pre.length);if(!rest)return;out.add(pre+rest.split("/")[0])});
  return [...out].sort((a,b)=>a.localeCompare(b,"pt-BR"));
}
function contaDentro(sec,path){return D.arquivos.filter(a=>a.secao===sec&&(a.pasta===path||String(a.pasta).startsWith(path+"/"))).length}
function renderPastas(k,target){
  const sec=SECAO[k], cur=pasta[k], el=target||$("#view-"+k);
  const parts=cur?cur.split("/"):[];
  const subs=subpastas(sec,cur), files=D.arquivos.filter(a=>a.secao===sec&&String(a.pasta||"")===cur);
  const pastaReg=D.pastas.find(p=>p.secao===sec&&p.caminho===cur);
  const vazia=cur&&!subs.length&&!files.length;
  el.innerHTML=`<div class="stack" data-pk="${k}">
  ${target?"":`<div class="sec-h"><h2>${sec}</h2></div>`}
  <div class="crumbs"><button data-go="">${sec}</button>${parts.map((p,i)=>`<span>/</span><button data-go="${esc(parts.slice(0,i+1).join("/"))}">${esc(p)}</button>`).join("")}</div>
  <div class="toolbar">
    <button class="btn" data-newfolder>Nova pasta</button>
    <label class="btn primary filebtn">Enviar arquivo<input type="file" data-upload multiple aria-label="Enviar arquivo"></label>
    ${vazia&&pastaReg?(confirmDel==="p"+pastaReg.num?`<button class="btn danger" data-pdel-ok="${pastaReg.num}">Confirmar exclusão da pasta</button>`:`<button class="btn danger" data-pdel="${pastaReg.num}">Excluir pasta vazia</button>`):""}
  </div>
  ${editing==="pasta:"+k?`<form class="inline-form" data-folderform><label for="nf-${k}">Nome da nova pasta${cur?` dentro de ${esc(cur)}`:""}<input id="nf-${k}" name="nome" required placeholder="Ex.: Prefeitura"></label><button class="btn primary" type="submit">Criar</button><button class="btn" type="button" data-cancel>Cancelar</button></form>`:""}
  ${subs.length?`<div class="fold-grid">${subs.map(p=>`<button class="fold" data-go="${esc(p)}">${ICON_F}<span>${esc(p.split("/").pop())}<small>${contaDentro(sec,p)} arquivo(s)</small></span></button>`).join("")}</div>`:""}
  <div class="group">${files.length?files.map(a=>{const ext=extOf(a.nome), viz=ext==="ifc"?"ifc":(ext==="dwg"||ext==="dxf")?"cad":"";
    return `<div class="file"><span class="ext">${esc(ext.toUpperCase())}</span><div><div class="nm">${esc(a.nome)}</div><div class="sub">Enviado em ${fmtData(a.enviado)}${a.obs?" · "+esc(a.obs):""}</div></div>
    <div class="acts">${viz?`<button class="btn" data-viz="${viz}" data-id="${esc(a.fileId)}" data-nome="${esc(a.nome)}">Visualizar</button>`:""}${a.link?`<a class="btn" href="${esc(a.link)}" target="_blank" rel="noopener">Abrir</a>`:""}
    ${confirmDel==="a"+a.num?`<button class="btn danger" data-adel-ok="${a.num}">Confirmar</button>`:`<button class="edit-link" data-adel="${a.num}">Excluir</button>`}</div></div>`}).join("")
    :`<div class="rec"><div class="hint">${subs.length?"Nenhum arquivo solto nesta pasta.":"Pasta vazia. Use \"Enviar arquivo\" para adicionar PDFs, imagens, IFC ou DWG."}</div></div>`}</div>
  </div>`;
}
document.querySelector("main").addEventListener("click",e=>{
  const box=e.target.closest("[data-pk]");if(!box)return;const k=box.dataset.pk, sec=SECAO[k];
  const t=e.target.closest("button");if(!t)return;
  const rer=()=>k==="contratos"?renderPastas("contratos",$("#contratos-pastas")):render();
  if(t.dataset.go!==undefined){pasta[k]=t.dataset.go;editing=null;confirmDel=null;rer();return}
  if(t.hasAttribute("data-newfolder")){editing="pasta:"+k;rer();const i=document.getElementById("nf-"+k);i&&i.focus();return}
  if(t.hasAttribute("data-cancel")){editing=null;rer();return}
  if(t.dataset.pdel){confirmDel="p"+t.dataset.pdel;rer();return}
  if(t.dataset.pdelOk){act({tabela:"pastas",acao:"excluir",num:Number(t.dataset.pdelOk)},"Pasta excluída");pasta[k]=pasta[k].split("/").slice(0,-1).join("/");return}
  if(t.dataset.adel){confirmDel="a"+t.dataset.adel;rer();return}
  if(t.dataset.adelOk){act({tabela:"arquivos",acao:"excluir",num:Number(t.dataset.adelOk)},"Arquivo excluído");return}
  if(t.dataset.viz){openRemote(t.dataset.viz,t.dataset.id,t.dataset.nome);return}
});
document.querySelector("main").addEventListener("submit",e=>{
  const f=e.target;if(!f.hasAttribute("data-folderform"))return;e.preventDefault();
  const k=f.closest("[data-pk]").dataset.pk, nome=new FormData(f).get("nome").trim().replace(/\//g,"-");if(!nome)return;
  const caminho=(pasta[k]?pasta[k]+"/":"")+nome;
  act({tabela:"pastas",acao:"adicionar",dados:{secao:SECAO[k],caminho,criada:hojeISO()}},"Pasta criada");
});
document.querySelector("main").addEventListener("change",e=>{
  const inp=e.target;if(!inp.matches("[data-upload]"))return;
  const k=inp.closest("[data-pk]").dataset.pk, files=[...inp.files];inp.value="";if(!files.length)return;
  needPin(async()=>{
    for(const f of files){
      if(f.size>35*1024*1024){toast(`${f.name}: arquivo acima de 35 MB.`);continue}
      toast(`Enviando ${f.name}…`);
      const b64=await new Promise((ok,err)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=err;r.readAsDataURL(f)});
      const okk=await send({acao:"upload",dados:{secao:SECAO[k],pasta:pasta[k],nome:f.name,mime:f.type||"application/octet-stream",base64:b64}},`${f.name} enviado`);
      if(!okk)break;
    }
  });
});

/* ---------- VISUALIZADORES ---------- */
const VZ={ifc:{nome:"Modelo IFC",ext:[".ifc"],aceita:".ifc",dica:"Gire com um dedo (ou botão esquerdo), arraste com dois dedos (ou botão direito) e aproxime com pinça ou roda do mouse."},
          cad:{nome:"Planta DWG/DXF",ext:[".dwg",".dxf"],aceita:".dwg,.dxf",dica:"Arraste para mover e use pinça ou a roda do mouse para aproximar. DWG muito recente ou complexo pode não abrir; nesse caso, salve como DXF."}};
const viewers={ifc:null,cad:null}; let vState={ifc:{nome:""},cad:{nome:""}};
function renderViewer(k){
  const cfg=VZ[k], el=$("#view-"+k);
  if(el.dataset.ready){listaVZ(k);return}
  el.dataset.ready="1";
  el.innerHTML=`<div class="stack">
  <div class="vbar"><label class="btn primary filebtn">Abrir arquivo do aparelho<input type="file" accept="${cfg.aceita}" data-local="${k}" aria-label="Abrir arquivo"></label>
    <button class="btn" data-reset="${k}">Centralizar</button><span class="name" id="vz-name-${k}"></span></div>
  <div class="viewer" id="vz-${k}"><div class="empty">Abra um arquivo ${cfg.ext.join(" ou ").toUpperCase()} do seu aparelho ou escolha um da lista abaixo.<br>O arquivo é aberto só no seu navegador.</div></div>
  <div class="hint">${cfg.dica}</div>
  <div class="sec-h"><h2>Arquivos da obra</h2></div><div class="group" id="vz-list-${k}"></div></div>`;
  listaVZ(k);
}
function listaVZ(k){
  const box=$("#vz-list-"+k);if(!box)return;
  const fs=D.arquivos.filter(a=>VZ[k].ext.some(x=>String(a.nome).toLowerCase().endsWith(x)));
  box.innerHTML=fs.length?fs.map(a=>`<div class="file"><span class="ext">${esc(extOf(a.nome).toUpperCase())}</span><div><div class="nm">${esc(a.nome)}</div><div class="sub">${esc(a.secao)}${a.pasta?" / "+esc(a.pasta):""}</div></div><div class="acts"><button class="btn" data-viz="${k}" data-id="${esc(a.fileId)}" data-nome="${esc(a.nome)}">Visualizar</button></div></div>`).join("")
    :`<div class="rec"><div class="hint">Nenhum arquivo ${VZ[k].ext.join("/").toUpperCase()} enviado ainda. Envie em Projetos para ficar disponível para a equipe.</div></div>`;
}
async function getViewer(k,kindForFile){
  const box=$("#vz-"+k);
  const mod= k==="ifc"?"ifc":kindForFile;
  if(viewers[k]&&viewers[k].mod!==mod){viewers[k].v.dispose();viewers[k]=null}
  if(!viewers[k]){
    box.innerHTML="";
    const m=await import("./vendor/"+mod+".js");
    const dark=matchMedia("(prefers-color-scheme: dark)").matches&&document.documentElement.dataset.theme!=="light"||document.documentElement.dataset.theme==="dark";
    viewers[k]={mod,v:m.mount(box,{wasmPath:new URL("vendor/",location.href).href,fonts:["vendor/roboto-latin-400-normal.woff","vendor/roboto-latin-ext-400-normal.woff"],background:k==="ifc"?(dark?"#20262a":"#eef0ec"):"#ffffff"})};
  }
  return viewers[k].v;
}
async function abrirBuffer(k,buf,nome){
  const ext=extOf(nome), box=$("#vz-"+k);
  const mod=k==="ifc"?"ifc":(ext==="dwg"?"dwg":"dxf");
  const busyEl=document.createElement("div");busyEl.className="busy";busyEl.textContent="Abrindo "+nome+"…";box.appendChild(busyEl);
  try{const v=await getViewer(k,mod);box.appendChild(busyEl);await v.open(buf);$("#vz-name-"+k).textContent=nome;}
  catch(err){console.error(err);toast(ext==="dwg"?"Não foi possível abrir este DWG. Tente salvar como DXF.":"Não foi possível abrir o arquivo.");}
  finally{busyEl.remove()}
}
async function openRemote(k,id,nome){
  if(!configured){toast("Disponível quando a planilha for conectada.");return}
  showTab(k);
  toast("Baixando "+nome+"…");
  try{const r=await fetch(API_URL+"?arquivo="+encodeURIComponent(id));const d=await r.json();if(!d.ok)throw new Error(d.erro);
    const bin=atob(d.base64), u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    await abrirBuffer(k,u8.buffer,nome);
  }catch(e){toast("Não foi possível baixar o arquivo.")}
}
document.querySelector("main").addEventListener("change",async e=>{
  const inp=e.target;if(!inp.matches("[data-local]"))return;const k=inp.dataset.local, f=inp.files[0];inp.value="";if(!f)return;
  await abrirBuffer(k,await f.arrayBuffer(),f.name);
});
document.querySelector("main").addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.reset&&viewers[t.dataset.reset])viewers[t.dataset.reset].v.resetView();
  if(t.dataset.viz&&t.closest(".view")&&t.closest("#vz-list-ifc,#vz-list-cad"))openRemote(t.dataset.viz,t.dataset.id,t.dataset.nome);
});

(function(){let t="checklist";try{const h=location.hash.slice(1)||localStorage.getItem("of-tab");if(h&&document.querySelector(`.tab[data-tab="${h}"]`))t=h}catch(e){}showTab(t)})();
load();
setInterval(()=>{if(!document.hidden&&!busy&&!editing)load()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!editing)load()});
</script>
